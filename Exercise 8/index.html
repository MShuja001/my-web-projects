<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Animation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            width: 80vw;
            height: 80vh;
            background-color: #9e9fcb;
            position: relative;
        }
        .box{
            width: 100px;
            height: 100px;
            background-color: #565672;
            border-radius: 70px;
            position:absolute;
            bottom: 0px;
            left: 0px;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: x-axis 3s linear infinite
                       ,y-axis 0.5s ease-out infinite alternate;
        }
        @keyframes x-axis{
            from{
                left: 0;
            }

            to{
                left: 100vw;
            }
        }
        @keyframes y-axis {
            from{
                bottom:0;
            }
            to{
                bottom: 30%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
