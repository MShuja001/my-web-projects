<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Forms Layout</h1>
    <form action="">
       <div> <label for="name">Enter Your Username:</label>
        <input type="text" id="name" name="Username" placeholder="Jhon Doe" autofocus>
        </div><br>
        <div>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female">
        </div>
        <div>
        <input type="checkbox" name="subscribe" id="checkbox" value="yes">
        <label for="checkbox">Subscribe to newsletter</label>
        </div>
        <label for="text">Enter comments</label><br>
        <textarea name="text" id="text" cols="40" rows="5" placeholder="Please Comment..."></textarea>
        <div>
            <label for="select">Please Select Fruit</label>
        <select name="Fruit" id="select">
            <option value="Apple">Apple</option>
            <option value="Banana">Banana</option>
            <option value="Cherry">Cherry</option>
        </select>
        </div>
    </form>
</body>
</html>
