<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition Property</title>
    <style>
        
        .container{
            background-color: #bce5c3d8;
            width: 80vw;
            height: 80vh;
        
        }
        .box{
            background-color: #91b397d8;
            width: 300px;
            height: 300px;
            color: #bce5c3d8;
        }
        .box:hover{
            transform: translateX(20vw) translateY(20vh) scale(2) rotateX(45deg) rotateY(45deg) skewX(23deg);
            transition: all 2s ease-in-out 0.1s;
            font-size: large;
            font-weight: bold;
            font-family: 'segoe UI';
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"><h2>Dont Hover on me</h2></div>
    </div>
</body>
</html>
