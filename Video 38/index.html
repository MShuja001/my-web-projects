<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        .container{
            display: flex;
            border: 2px solid red;
            height: 80vh;
            gap: 10px 20px;
            /* flex-direction: column-reverse; */
            
            /* flex-wrap: wrap; */
            /* align-content: center; Works when there are multiple rows */
            /* justify-content: center; */
            /* align-items: center; Works when there is a single row */
            /* flex-flow: row wrap; */

        }
        .item{
            background-color: rgb(69, 148, 174);
            border: 2px solid black;
            height: 100px;
            width: 100px;
            flex-grow: 1;
        }
        .item2{
            order: -1;
            flex-grow: 2;
            align-self: flex-end;
        }
        .item1{
            order: 0;
            flex-shrink: 2;
            align-self: flex-start;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>
</html>
