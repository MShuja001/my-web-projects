<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --hover-color: #bce1be;
            --text-color: white;
        }
        nav.navbar {
            background-color: var(--primary-color);
            border-radius: 40px;

        }
        ul{
            display: flex;
            margin: 25px;
            /* padding: 25px; */
        }
        ul li {
            list-style: none;
            padding: 25px 25px 25px 0;
        }
        ul li a{
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            font-size: 20px;
        }
        ul li a:hover{
            color: var(--hover-color);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="./">Home</a></li>
            <li><a href="https://www.google.com">About</a></li>
            <li><a href="https://www.doodle.com">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
