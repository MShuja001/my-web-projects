<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid in CSS</title>
    <style>
        .container{
            display: grid;
            border: 2px solid black;
            grid-template-areas: "nav nav nav"
                                 "side main gain"
                                 "footer footer footer";
            gap: 10px 30px;
            align-items: center;               
            justify-items: center;
            width: 100vw;
            height: 90vh;
        }
        .item{
            border: 2px solid red;
            height: 60px;
            width: 60px;

        }
        .item1{
            grid-area: nav;
            align-self: end;
            justify-self: start;
        }
        .item2{
            grid-area: side;
        }
        .item3{
            grid-area: main;
        }
        .item4{
            grid-area: footer;
        }
        .item5{
            grid-area: gain;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item item5">5</div>
    </div>
</body>
</html>
