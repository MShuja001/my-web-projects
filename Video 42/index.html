<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            }
            .container{
                width: 100vw;
                height: 80vh;
                border: 2px solid black;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .box{
                width: 200px;
                height: 200px;
                background-color: rgb(164, 226, 202);
                border: 2px solid green;
            }
            .box:hover{
                /* transform: skew(40deg); */
                /* transform: rotateY(45deg); */
                /* transform: scale3d(1.6); */
                /* transform: translate(100%) rotate(1turn) scale(1.4); */
                transform: matrix3d(23);
                transition: 0.6s;
                /* transform-origin: 0 0; */
                
            }
    </style>
</head>
<body>
        <div class="container">
            <div class="box">
                BOX
            </div>
        </div>
</body>
</html>
