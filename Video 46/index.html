<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <style>
        .container{
            background-color: #bb8787;
            width: 80vw;
            height: 80vh;
        }
        .box{
            width: 200px;
            height: 200px;
            background-color: #8e6868;
            text-align: center;
            font-size: large;
            color: #e5e5e5;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: Shuja1 2s ease-in-out 2s alternate backwards,
                        Shuja2 2s ease-out 2s alternate-reverse backwards;
        }
        
        @keyframes Shuja1 {
            from{
                
            }
            to{
                box-shadow: #bb8787;
                background-color: #79020267;
                transform: scale(2) translate(40vh);
        }
        }
        @keyframes Shuja2 {
            25%{
                transform: rotate(10deg);
            }
            50%{
                transform: rotate(30deg);
                
            }
            75%{
                transform: rotate(125deg);
                
            }
            100%{
                transform: rotate(250deg);

            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            This is a BOX
        </div>
    </div>
</body>
</html>
