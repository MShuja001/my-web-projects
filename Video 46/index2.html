<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations IN CSS</title>
    <style>
        .container{
            background-color: #e6efb2;
            width: 80vw;
            height: 80vh;
        }
        .box{
            background-color: #b4bc87;
            width: 300px;
            height: 300px;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: shuja2 2s ease 2 3s alternate forwards;
        }
        @keyframes shuja1 {
            from{
                
            }
            to{
                font-size: large;
                transform: scale(2) translate(30vw) rotate(45deg);
            }
        }
        @keyframes shuja2 {
            25%{
                transform: scale(2) translate(30vw) rotate(45deg);
            }
            50%{
                transform: scale(3) translate(40vw) rotate(85deg);
            }
            75%{
                transform: scale(4) translate(50vw) rotate(125deg);
            }
            100%{
                transform: scale(5) translate(60vw) rotate(250deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Box</div>
    </div>
</body>
</html>
